# This workflow will install Python dependencies, and run tests with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/tutorials/build-and-test-code/python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and run tests

    strategy:
      fail-fast: false
      matrix:
        # See https://github.com/actions/runner-images for available OS images
        os: ["ubuntu-24.04", "ubuntu-26.04", "macos-15", "macos-26", "windows-2025"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    steps:
    # https://github.com/actions/checkout
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # https://docs.astral.sh/uv/guides/integration/github/
    # https://github.com/astral-sh/setup-uv
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.19"

    - name: Set UV_PYTHON to Python ${{ matrix.python-version }}
      if: runner.os == 'Linux'
      run: echo "UV_PYTHON=${PYTHON_VERSION}" >> $GITHUB_ENV
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}

    - name: Set UV_PYTHON to Python ${{ matrix.python-version }}
      if: runner.os == 'Windows'
      run: echo "UV_PYTHON=${env:PYTHON_VERSION}" >> $env:GITHUB_ENV
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}

    - name: Install Python ${{ matrix.python-version }}
      run: uv python install

    - name: Create virtual Python environment
      run: uv venv

    - name: Install ruff
      run: uv pip install ruff

    - name: Check linting errors
      run: uv run --no-sync ruff check src tests

    - name: Check code formatting
      run: uv run --no-sync ruff format --check src tests

    - name: Install pytest and modules
      run: uv pip install pytest

    - name: Test with pytest
      run: uv run --isolated -- pytest --full-trace tests/
